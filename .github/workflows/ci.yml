name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Type-check · Build
    runs-on: ubuntu-latest
    env:
      # Dummy values so Next's build doesn't error on missing env.
      # No actual DB connection happens at build time (all pages are force-dynamic).
      DATABASE_URL: postgresql://user:pass@localhost:5432/dummy?sslmode=disable
      AUTH_SECRET: ci-only-not-a-real-secret-ci-only-not-a-real-secret
      AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

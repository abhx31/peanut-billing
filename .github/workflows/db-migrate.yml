name: Migrate database

on:
  push:
    branches: [main, staging]
    paths:
      - 'drizzle/**.sql'
      - 'drizzle/meta/**'
      - '.github/workflows/db-migrate.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which database to migrate'
        required: true
        type: choice
        options: [production, staging]
      confirm:
        description: 'Type "MIGRATE" to confirm.'
        required: true
        type: string

concurrency:
  group: db-migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate-production:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
    name: Apply migrations (production)
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
    steps:
      - name: Verify confirmation (manual runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.confirm != 'MIGRATE'
        run: |
          echo "::error::You must type MIGRATE to confirm. Got: '${{ inputs.confirm }}'"
          exit 1

      - name: Guard against missing PROD_DATABASE_URL
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::PROD_DATABASE_URL secret is not set."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund --prefer-offline
      - run: npm run db:migrate

  migrate-staging:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/staging') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
    name: Apply migrations (staging)
    runs-on: ubuntu-latest
    environment: staging
    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
    steps:
      - name: Verify confirmation (manual runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.confirm != 'MIGRATE'
        run: |
          echo "::error::You must type MIGRATE to confirm. Got: '${{ inputs.confirm }}'"
          exit 1

      - name: Guard against missing TEST_DATABASE_URL
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::TEST_DATABASE_URL secret is not set."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund --prefer-offline
      - run: npm run db:migrate

name: Migrate production DB

on:
  push:
    branches: [main]
    paths:
      - 'drizzle/**.sql'
      - 'drizzle/meta/**'
      - '.github/workflows/db-migrate.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "MIGRATE" to confirm you want to run migrations against the production database.'
        required: true
        type: string

concurrency:
  group: db-migrate-prod
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
    steps:
      - name: Verify confirmation (manual runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.confirm != 'MIGRATE'
        run: |
          echo "::error::You must type MIGRATE to confirm. Got: '${{ inputs.confirm }}'"
          exit 1

      - name: Guard against missing PROD_DATABASE_URL
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::PROD_DATABASE_URL secret is not set."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Run migrations
        run: npm run db:migrate

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      next:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "eslint-config-next"
      drizzle:
        patterns:
          - "drizzle-orm"
          - "drizzle-kit"
      ui:
        patterns:
          - "@base-ui/*"
          - "lucide-react"
          - "tailwindcss"
          - "@tailwindcss/*"
      types:
        patterns:
          - "@types/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

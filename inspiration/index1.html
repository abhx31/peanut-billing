<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peanut Billing</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f5f1;--card:#fff;--ink:#1c2a21;--mut:#64706a;--line:#d9dfd6;--acc:#2b6a3d;--on:#fff;--bad:#b3261e;--soft:#e6efe7}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111713;--card:#1a221c;--ink:#e6ece7;--mut:#93a097;--line:#2c382f;--acc:#6dbb82;--on:#0d1a11;--bad:#ff8a80;--soft:#223027}}
:root[data-theme="dark"]{--bg:#111713;--card:#1a221c;--ink:#e6ece7;--mut:#93a097;--line:#2c382f;--acc:#6dbb82;--on:#0d1a11;--bad:#ff8a80;--soft:#223027}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:6px 0 10px;cursor:pointer}
h2{font-size:16px;margin:0 0 10px}
nav{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
nav button{flex:0 0 auto;white-space:nowrap;padding:10px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font-size:15px}
nav button.on{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label{display:block;font-size:13px;color:var(--mut)}
input,select,textarea{width:100%;padding:9px;margin-top:3px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit}
textarea{resize:vertical}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn{padding:10px 16px;border:0;border-radius:8px;background:var(--acc);color:var(--on);font-size:15px;font-weight:600;cursor:pointer}
.sm{padding:4px 9px;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;cursor:pointer;margin:1px}
.sm.del{color:var(--bad)}
.tog{display:block;width:100%;padding:10px;margin-top:3px;font-size:15px}
.tog.on{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:600}
.sum{background:var(--soft);border-radius:8px;padding:10px;margin:12px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.sum b{display:block;font-size:17px}.sum span{font-size:12px;color:var(--mut)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child,.l{text-align:left}
th{font-weight:600;color:var(--mut);font-size:13px}
.neg{color:var(--bad)}.empty{color:var(--mut);padding:8px 0}
.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
#inv{display:none}
@media print{body>main{display:none}#inv{display:block;color:#000;background:#fff;padding:20px;font-size:14px}#inv table td,#inv table th{border-bottom:1px solid #999;color:#000}#inv .sum{background:#eee}#inv .sum span{color:#333}#inv .neg{color:#000}}
</style></head><body>
<main>
<div id="bn" class="card" hidden></div>
<h1 id="firm" title="Tap to rename"></h1>
<div id="role" class="empty"></div>
<nav><button data-t="bill" class="on">New bill</button><button data-t="lots">Add lots</button><button data-t="day">Daily summary</button><button data-t="stock">Stock</button><button data-t="ledger">Daily ledger</button><button data-t="exp">Expenses</button><button data-t="bal">Balances</button><button data-t="profit">Profit</button></nav>

<section id="bill">
<div class="card"><h2>Create bill</h2><div id="nb" style="font-weight:600;margin-bottom:8px"></div>
<div class="grid">
<label>Date<input type="date" id="bd"></label>
<label>Customer name<input id="bc" placeholder="Customer" list="cl" autocomplete="off"><datalist id="cl"></datalist></label>
<label>Hamali per bag (₹)<input type="number" id="bh" min="0" step="0.5"></label>
<label>Bill type<select id="bg"><option value="0">Without GST</option><option value="5">GST 5%</option><option value="12">GST 12%</option><option value="18">GST 18%</option></select></label>
</div>
<h2 style="margin-top:16px">Lots in this bill</h2>
<div class="tw" id="cart"></div>
<div class="grid" style="margin-top:8px">
<label>Lot / quality<select id="bl"></select></label>
<label>No. of bags<input type="number" id="bb" min="0" step="1"></label>
<label style="grid-column:1/-1">Weight of each bag (kg) – separate with space, comma or new line. Same weight bags: 50x40.5 means 50 bags of 40.5 kg<textarea id="bw" rows="3" placeholder="40.5 41 39.8 50x40.5"></textarea><span id="bwi" class="empty"></span></label>
<label>Total weight (kg)<input type="number" id="bk" min="0" step="0.01"></label>
<label>Price per kg (₹)<input type="number" id="bp" min="0" step="0.01"></label>
</div>
<button class="sm" id="additem" type="button" style="margin:10px 0;padding:9px 14px">+ Add this lot to the bill (another lot for the same customer)</button>
<h2 style="margin-top:8px">Payment</h2>
<div class="grid">
<label>Paid cash (₹)<input type="number" id="bcash" min="0" step="0.01"></label>
<label>Paid UPI (₹)<input type="number" id="bupi" min="0" step="0.01"></label>
<div><label>Payment option</label><button class="sm tog" id="credit" type="button" aria-pressed="false">Balance / credit</button></div>
</div>
<div id="prev" class="empty"></div>
<div class="sum" id="pv"></div>
<button class="btn" id="save">Save bill</button> <button class="btn" id="savep" type="button">Save &amp; print</button> <span id="msg" class="empty"></span>
</div></section>

<section id="stock" hidden>
<div class="card"><h2>Stock left</h2><div class="sum" id="sts"></div><div class="tw" id="stt"></div></div>
<div class="card"><h2>Stock added (latest 30)</h2><div class="tw" id="sth"></div></div>
</section>

<section id="ledger" hidden>
<div class="card"><div class="row"><label>Date<input type="date" id="ld"></label><button class="sm" id="lp" type="button">Print ledger</button><button class="sm" id="lo" type="button">Set opening balance</button></div></div>
<div id="lgc"></div>
</section>

<section id="exp" hidden>
<div class="card"><h2>Add expense</h2><div class="grid">
<label>Date<input type="date" id="xd"></label>
<label>Category<input id="xc" list="xcl" placeholder="e.g. Transport" autocomplete="off"><datalist id="xcl"><option value="Hamali / labour"><option value="Transport"><option value="Rent"><option value="Salary"><option value="Electricity"><option value="Packing / bags"><option value="Tea &amp; food"><option value="Repairs"><option value="Other"></datalist></label>
<label>Note<input id="xn" placeholder="Optional"></label>
<label>Amount (₹)<input type="number" id="xa" min="0" step="0.01"></label>
<label>Paid by<select id="xm"><option>Cash</option><option>UPI</option></select></label></div>
<button class="btn" id="xadd" style="margin-top:10px">Add expense</button></div>
<div class="card"><h2>Expenses on this date</h2><div class="tw" id="xl"></div></div>
</section>

<section id="profit" hidden>
<div class="card"><div class="row"><label>Accounting period (1 Apr – 31 Mar)<select id="pf"></select></label></div><div class="sum" id="pst"></div></div>
<div class="card"><h2>Profit by lot</h2><div class="tw" id="pl"></div></div>
<div class="card"><h2>Profit on each bill</h2><div class="tw" id="pb"></div></div>
</section>

<section id="bal" hidden>
<div class="card"><h2>Backup</h2><button class="sm" id="bk1">Download all bills (CSV)</button> <button class="sm" id="bk2">Download full backup (JSON)</button></div>
<div class="card"><h2>Customer balances (credit given)</h2><div class="tw" id="bt"></div></div>
</section>

<section id="lots" hidden>
<div class="card"><h2>Add lot</h2>
<div class="row">
<label style="flex:2;min-width:160px">Lot no. / quality name<input id="ln" placeholder="e.g. Lot 12 – Bold 40/50"></label>
<label style="flex:1;min-width:90px">Bags<input type="number" id="lb" min="0" step="1"></label>
<label id="lcw" style="flex:1;min-width:110px">Cost per kg (₹)<input type="number" id="lc" min="0" step="0.01"></label>
<button class="btn" id="addlot">Add lot</button></div></div>
<div class="card"><h2>Stock</h2><div class="tw" id="lt"></div></div>
</section>

<section id="day" hidden>
<div class="card"><div class="row"><label>Date<input type="date" id="dd"></label></div>
<div class="sum" id="ds"></div></div>
<div class="card"><h2>Bills on this date</h2><div class="tw" id="dt"></div></div>
<div class="card"><h2>Stock left</h2><div class="tw" id="st"></div></div>
</section>
</main>
<div id="inv"></div>

<script>
const $=s=>document.querySelector(s);
let isOwner=false,costs={},costsLoaded=false,migrating=false,db=null,ready=false,D={lots:[],bills:[],hamali:10,next:1,firm:"Peanut Traders"},R={lots:[],stockin:[],bills:[],pays:[],expenses:[],meta:{}};
const n=v=>parseFloat(v)||0,r2=v=>Math.round(v*100)/100,f=v=>"₹"+r2(v).toLocaleString("en-IN");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const p2=v=>String(v).padStart(2,"0");
const fyOf=d=>{const y=+d.slice(0,4),m=+d.slice(5,7),a=m>=4?y:y-1;return a+"-"+p2((a+1)%100)};
const nextNo=d=>D.bills.filter(b=>b.fy===fyOf(d)).reduce((m,b)=>Math.max(m,b.no),0)+1;
const paid=b=>b.pays.reduce((s,p)=>s+p.a,0),key=s=>s.trim().toLowerCase();
const banner=t=>{const b=$("#bn");b.textContent=t;b.hidden=!t};
async function W(fn){
 if(!db){alert("Shared storage is not connected. Open this page signed in to Claude.");return false}
 try{await fn();return true}catch(e){alert("Could not save: "+(e&&(e.message||e.code))+"\nIf you have view-only access, ask the owner to give you edit access.");return false}
}
const rows=s=>s.docs.map(d=>({id:d.id,...d.data()}));
function rebuild(){
 const sold={},got={},pm={};
 R.bills.forEach(b=>itemsOf(b).forEach(i=>sold[i.lotId]=(sold[i.lotId]||0)+i.bags));
 R.stockin.forEach(s=>got[s.lotId]=(got[s.lotId]||0)+s.bags);
 R.pays.forEach(p=>(pm[p.billId]||(pm[p.billId]=[])).push(p));
 D.lots=R.lots.map(l=>({...l,cost:costs[l.id]||0,hasCost:costs[l.id]!==undefined,bags:(got[l.id]||0)-(sold[l.id]||0)})).sort((a,b)=>(a.at||0)-(b.at||0));
 D.bills=R.bills.map(b=>({...b,fy:b.fy||fyOf(b.date),items:itemsOf(b),profit:S(itemsOf(b),i=>i.amount-i.kg*(costs[i.lotId]||0)),pays:pm[b.id]||[]})).sort((a,b)=>a.no-b.no);
 D.hamali=R.meta.hamali??10;D.firm=R.meta.firm||"Peanut Traders";
 D.next=D.bills.reduce((m,b)=>Math.max(m,b.no),0)+1;
 migrate();render();
}
async function migrate(){
 if(!isOwner||!costsLoaded||!ready||migrating)return;
 const ol=R.lots.filter(l=>l.cost!==undefined),ob=R.bills.filter(b=>b.profit!==undefined);
 if(!ol.length&&!ob.length)return;
 migrating=true;let ok=false;
 try{
  const nc={...costs};ol.forEach(l=>{if(nc[l.id]===undefined)nc[l.id]=n(l.cost)});
  await db.doc("private/costs").set(nc);
  for(const l of ol){const {id,cost,...rest}=l;await db.doc("lots/"+id).set(rest)}
  for(const b of ob){const {id,profit,...rest}=b;await db.doc("bills/"+id).set(rest)}
 ok=true}catch(e){}
 migrating=false;if(ok)rebuild();
}
function applyRole(known){
 document.querySelector('nav [data-t="profit"]').hidden=!isOwner;
 $("#lcw").hidden=!isOwner;
 $("#role").textContent=known?(isOwner?"Owner view: profit and cost are visible only to you":"Staff view"):"";
}
const sub=(name,k)=>db.collection(name).onSnapshot(s=>{R[k]=rows(s);ready=true;rebuild()},e=>banner("Connection problem ("+e.code+"). Reload the page."));
const setMeta=(firm,hamali,extra)=>db.doc("meta/settings").set({...R.meta,firm,hamali,...(extra||{})});
const S=(a,fn)=>a.reduce((t,x)=>t+fn(x),0),allPays=()=>D.bills.flatMap(b=>b.pays.map(p=>({...p,b})));

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
 document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
 ["bill","lots","day","stock","ledger","exp","bal","profit"].forEach(id=>$("#"+id).hidden=id!==b.dataset.t);render()});
$("#firm").onclick=()=>{const v=prompt("Firm name",D.firm);if(v)W(()=>setMeta(v,D.hamali))};

let cart=[];
function curItem(){
 const lot=D.lots.find(l=>l.id==$("#bl").value),bags=n($("#bb").value),kg=n($("#bk").value),rate=n($("#bp").value);
 return lot&&bags>0&&kg>0&&rate>0?{lotId:lot.id,lot:lot.name,bags,kg,rate,wts:$("#bw").value.trim().replace(/\s+/g," "),amount:kg*rate}:null;
}
function calc(){
 const cur=curItem(),items=cart.concat(cur?[cur]:[]),hr=n($("#bh").value),g=n($("#bg").value),cash=n($("#bcash").value),upi=n($("#bupi").value);
 const bags=S(items,i=>i.bags),kg=S(items,i=>i.kg),amount=S(items,i=>i.amount),ham=bags*hr,gst=amount*g/100,total=amount+ham+gst,bal=total-cash-upi;
 const profit=S(items,i=>{const l=D.lots.find(x=>x.id==i.lotId);return i.amount-i.kg*(l?l.cost:0)});
 return{items,bags,kg,amount,ham,gst,total,bal,profit,hr,g,cash,upi};
}
function addItem(){
 const it=curItem();
 if(!it){$("#msg").textContent="Pick a lot and enter bags, weight and price first.";return}
 cart.push(it);["bb","bk","bw","bp"].forEach(id=>$("#"+id).value="");$("#bwi").textContent="";$("#msg").textContent="";drawCart();preview();
}
function rmItem(i){cart.splice(i,1);drawCart();preview()}
function drawCart(){
 $("#cart").innerHTML=cart.length?`<table><tr><th>Lot / quality</th><th>Bags</th><th>Kg</th><th>Price/kg</th><th>Amount</th><th></th></tr>${cart.map((i,x)=>`<tr><td>${esc(i.lot)}</td><td>${i.bags}</td><td>${i.kg}</td><td>${f(i.rate)}</td><td>${f(i.amount)}</td><td><button class="sm del" type="button" onclick="rmItem(${x})">Remove</button></td></tr>`).join("")}</table>`:`<div class="empty">No lot added yet. Fill in a lot below, then tap the add button, or just save if the bill has one lot.</div>`;
}
$("#additem").onclick=addItem;
function itemsOf(b){return b.items||[{lotId:b.lotId,lot:b.lot,bags:b.bags,kg:b.kg,rate:b.rate,wts:b.wts||"",amount:b.amount}]}
function preview(){
 const c=calc(),d0=$("#bd").value||today();
 $("#nb").textContent="Bill no. "+p2(nextNo(d0))+"  ·  period "+fyOf(d0);
 $("#pv").innerHTML=[["Bags · kg",c.bags+" · "+r2(c.kg)],["Amount (kg × price)",f(c.amount)],["Hamali",f(c.ham)],c.g?["GST "+c.g+"%",f(c.gst)]:null,["Total",f(c.total)],["Balance",f(c.bal)],isOwner?["Profit on this bill",f(c.profit)]:null]
 .filter(Boolean).map(x=>`<div><span>${x[0]}</span><b>${x[1]}</b></div>`).join("");
}
function fillLots(){
 const cur=$("#bl").value;
 $("#bl").innerHTML=D.lots.length?D.lots.map(l=>`<option value="${l.id}">${esc(l.name)} (${l.bags} bags left)</option>`).join(""):`<option value="">${ready?"Add a lot first":"Loading…"}</option>`;
 if(cur)$("#bl").value=cur;
}
function wparse(){
 let cnt=0,tot=0;
 ($("#bw").value.split(/[\s,;]+/).filter(Boolean)).forEach(t=>{
  const m=t.match(/^(\d+)[x*×](\d*\.?\d+)$/i);
  if(m){cnt+=+m[1];tot+=m[1]*m[2]}else if(n(t)>0){cnt++;tot+=n(t)}
 });
 return{cnt,tot:r2(tot)};
}
$("#bw").addEventListener("input",()=>{
 const w=wparse();
 if(w.cnt){$("#bk").value=w.tot;$("#bb").value=w.cnt}
 $("#bwi").textContent=w.cnt?w.cnt+" bags · total "+w.tot+" kg":"";
 preview();
});
["bd","bl","bb","bk","bp","bh","bg","bcash","bupi"].forEach(id=>$("#"+id).addEventListener("input",preview));
function prevHint(){
 const k=key($("#bc").value),c=k&&custs().find(x=>key(x.name)===k);
 $("#prev").textContent=c&&c.bal>0.5?"Earlier balance of this customer: "+f(c.bal)+" (not included in this bill's total)":"";
}
$("#bc").addEventListener("input",prevHint);
$("#credit").onclick=()=>setCredit(!$("#credit").classList.contains("on"));
function setCredit(on){
 const b=$("#credit");b.classList.toggle("on",on);b.setAttribute("aria-pressed",on);
 ["bcash","bupi"].forEach(id=>{const e=$("#"+id);e.disabled=on;if(on)e.value=""});
 preview();
}

$("#save").onclick=()=>saveBill(false);
$("#savep").onclick=()=>saveBill(true);
async function saveBill(pr){
 const c=calc(),cust=$("#bc").value.trim(),m=$("#msg");
 if(!cust||!c.items.length){m.textContent="Enter the customer and at least one lot with bags, weight and price.";return}
 const need={};c.items.forEach(i=>need[i.lotId]=(need[i.lotId]||0)+i.bags);
 for(const id in need){const l=D.lots.find(x=>x.id==id);if(l&&need[id]>l.bags&&!confirm("Only "+l.bags+" bags of "+l.name+" in stock. Continue?"))return}
 const d=$("#bd").value||today(),no=nextNo(d),pays=[];
 if(c.cash>0)pays.push({d,m:"Cash",a:c.cash});if(c.upi>0)pays.push({d,m:"UPI",a:c.upi});
 const bill={no,fy:fyOf(d),date:d,cust,items:c.items,lot:[...new Set(c.items.map(i=>i.lot))].join(" + "),bags:c.bags,kg:r2(c.kg),rate:r2(c.amount/c.kg),ham:c.ham,g:c.g,gst:c.gst,amount:c.amount,total:c.total,at:Date.now()};
 let id=null;
 const ok=await W(async()=>{
  const ref=await db.collection("bills").add(bill);id=ref.id;
  for(const p of pays)await db.collection("pays").add({billId:id,...p});
  if(c.hr!==D.hamali)await setMeta(D.firm,c.hr);
 });
 if(!ok)return;
 m.textContent="Saved bill no. "+p2(no)+(c.cash+c.upi<c.total-0.005?" (balance "+f(c.bal)+")":"");
 cart=[];["bc","bb","bk","bw","bp","bcash","bupi"].forEach(id=>$("#"+id).value="");$("#bwi").textContent="";
 setCredit(false);drawCart();preview();
 if(pr)printObj({...bill,id,pays});
}
$("#addlot").onclick=()=>{
 const name=$("#ln").value.trim();if(!name)return;
 const bags=n($("#lb").value),cost=n($("#lc").value);
 W(async()=>{
  const ref=await db.collection("lots").add({name,at:Date.now()});
  if(isOwner&&cost>0)await db.doc("private/costs").set({...costs,[ref.id]:cost});
  if(bags>0)await db.collection("stockin").add({lotId:ref.id,bags,d:today()});
 }).then(ok=>{if(ok)["ln","lb","lc"].forEach(id=>$("#"+id).value="")});
};
function addBags(id){const l=D.lots.find(x=>x.id==id),v=n(prompt("Bags to add to "+l.name,"0"));if(v>0)W(()=>db.collection("stockin").add({lotId:id,bags:v,d:today()}))}
function setCost(id){if(!isOwner)return;const l=D.lots.find(x=>x.id==id),v=prompt("Cost per kg for "+l.name,l.cost);if(v!==null)W(()=>db.doc("private/costs").set({...costs,[id]:n(v)}))}
function delLot(id){if(confirm("Delete this lot? Old bills keep its name."))W(()=>db.doc("lots/"+id).delete())}
function receive(id){
 const b=D.bills.find(x=>x.id==id),a=n(prompt("Amount received for bill no. "+p2(b.no)+" (balance "+f(b.total-paid(b))+")"));
 if(a<=0)return;const m=(prompt("Mode: type cash or upi","cash")||"").toLowerCase()==="upi"?"UPI":"Cash";
 W(()=>db.collection("pays").add({billId:id,d:today(),m,a}));
}
function delBill(id){
 if(!confirm("Delete this bill and return its bags to stock?"))return;
 const b=D.bills.find(x=>x.id==id);
 W(async()=>{for(const p of b.pays)await db.doc("pays/"+p.id).delete();await db.doc("bills/"+id).delete()});
}
function receiveCust(i){
 const c=custs().filter(x=>x.bal>0.5)[i];if(!c)return;
 let a=n(prompt("Amount received from "+c.name+" (balance "+f(c.bal)+")"));if(a<=0)return;
 const m=(prompt("Mode: type cash or upi","cash")||"").toLowerCase()==="upi"?"UPI":"Cash";
 W(async()=>{
  for(const b of D.bills.filter(x=>key(x.cust)===key(c.name)).sort((x,y)=>x.no-y.no)){
   const due=b.total-paid(b);if(due<=0.005)continue;
   const t=Math.min(due,a);await db.collection("pays").add({billId:b.id,d:today(),m,a:t});a-=t;if(a<=0.005)break;
  }
 });
}
function printBill(id){printObj(D.bills.find(x=>x.id==id))}
function printObj(b){
 const p=paid(b);
 $("#inv").innerHTML=`<h2 style="margin:0">${esc(D.firm)}</h2><p>Bill no. ${p2(b.no)} &nbsp; Period: ${b.fy||fyOf(b.date)} &nbsp; Date: ${b.date}<br>Customer: <b>${esc(b.cust)}</b></p>
 <table><tr><th class="l">Lot / quality</th><th>Bags</th><th>Weight (kg)</th><th>Price/kg</th><th>Amount</th></tr>
 ${itemsOf(b).map(i=>`<tr><td>${esc(i.lot)}</td><td>${i.bags}</td><td>${i.kg}</td><td>${f(i.rate)}</td><td>${f(i.amount)}</td></tr>`).join("")}${itemsOf(b).length>1?`<tr><th class="l">Total</th><th>${b.bags}</th><th>${b.kg}</th><th></th><th>${f(b.amount)}</th></tr>`:""}</table>

 <p style="text-align:right">Hamali: ${f(b.ham)}<br>${b.g?"GST "+b.g+"%: "+f(b.gst)+"<br>":""}<b>Total: ${f(b.total)}</b><br>Paid: ${f(p)}<br><b>Balance: ${f(b.total-p)}</b></p>`;

function custs(){

}

function cashBal(mode,before){
 const open=n(R.meta[mode==="Cash"?"openCash":"openBank"]);
 return open+S(allPays().filter(p=>p.m===mode&&p.d<before),p=>p.a)-S(R.expenses.filter(e=>e.mode===mode&&e.date<before),e=>e.amt);

}
function renderExp(){

function renderLedger(){
 const d=$("#ld").value||today(),bs=D.bills.filter(b=>b.date===d),pays=allPays().filter(p=>p.d===d),ex=R.expenses.filter(e=>e.date===d);
 const c0=cashBal("Cash",d),u0=cashBal("UPI",d),ci=S(pays.filter(p=>p.m==="Cash"),p=>p.a),ui=S(pays.filter(p=>p.m==="UPI"),p=>p.a);
 const co=S(ex.filter(e=>e.mode==="Cash"),e=>e.amt),uo=S(ex.filter(e=>e.mode==="UPI"),e=>e.amt),pr=S(bs,b=>b.profit);
 const bx=a=>`<div class="sum">${a.map(x=>`<div><span>${x[0]}</span><b>${x[1]}</b></div>`).join("")}</div>`;
 $("#lgc").innerHTML=`<div class="card"><h2>Cash in hand</h2>${bx([["Opening",f(c0)],["Cash received",f(ci)],["Cash expenses",f(co)],["Closing",f(c0+ci-co)]])}
 <h2>Bank / UPI</h2>${bx([["Opening",f(u0)],["UPI received",f(ui)],["UPI expenses",f(uo)],["Closing",f(u0+ui-uo)]])}
 <h2>Day result</h2>${bx([["Sales (total)",f(S(bs,b=>b.total))],["Balance given (credit)",f(S(bs,b=>b.total-paid(b)))],...(isOwner?[["Profit on bills",f(pr)]]:[]),["Expenses",f(co+uo)],...(isOwner?[["Profit after expenses",f(pr-co-uo)]]:[])])}</div>
 <div class="card"><h2>Money received</h2><div class="tw">${pays.length?`<table><tr><th>Bill no.</th><th>Customer</th><th>Mode</th><th>Amount</th></tr>${pays.map(p=>`<tr><td>${p2(p.b.no)}</td><td class="l">${esc(p.b.cust)}</td><td>${p.m}</td><td>${f(p.a)}</td></tr>`).join("")}</table>`:`<div class="empty">No money received on this date.</div>`}</div></div>
 <div class="card"><h2>Expenses</h2><div class="tw">${ex.length?`<table><tr><th>Category</th><th>Note</th><th>Paid by</th><th>Amount</th></tr>${ex.map(e=>`<tr><td>${esc(e.cat)}</td><td class="l">${esc(e.note||"")}</td><td>${e.mode}</td><td>${f(e.amt)}</td></tr>`).join("")}</table>`:`<div class="empty">No expenses on this date. Add them in the Expenses tab.</div>`}</div></div>
 <div class="card"><h2>Sales</h2><div class="tw">${bs.length?`<table><tr><th>Bill no.</th><th>Customer</th><th>Lot</th><th>Bags</th><th>Kg</th><th>Total</th><th>Paid</th><th>Balance</th></tr>${bs.map(b=>`<tr><td>${p2(b.no)}</td><td class="l">${esc(b.cust)}</td><td class="l">${esc(b.lot)}</td><td>${b.bags}</td><td>${b.kg}</td><td>${f(b.total)}</td><td>${f(paid(b))}</td><td>${f(b.total-paid(b))}</td></tr>`).join("")}</table>`:`<div class="empty">No bills on this date.</div>`}</div></div>`;

function renderProfit(){
 if(!isOwner){$("#pst").innerHTML="";$("#pl").innerHTML="";$("#pb").innerHTML="";return}
 const fys=[...new Set(D.bills.map(b=>b.fy).concat(fyOf(today())))].sort().reverse(),cur=$("#pf").value||fys[0];
 $("#pf").innerHTML=fys.map(y=>`<option>${y}</option>`).join("")+`<option value="all">All periods</option>`;
 $("#pf").value=cur;
 const bs=D.bills.filter(b=>cur==="all"||b.fy===cur),sum=(a,fn)=>a.reduce((t,x)=>t+fn(x),0);
 const tp=sum(bs,b=>b.profit),kg=sum(bs,b=>b.kg),sales=sum(bs,b=>b.amount);
 const exp=S(R.expenses.filter(e=>cur==="all"||fyOf(e.date)===cur),e=>e.amt);
 $("#pst").innerHTML=[["Total profit",f(tp)],["Expenses",f(exp)],["Profit after expenses",f(tp-exp)],["Sales (before hamali & GST)",f(sales)],["Bills",bs.length],["Kg sold",r2(kg)],["Profit per kg",f(kg?tp/kg:0)]].map(x=>`<div><span>${x[0]}</span><b>${x[1]}</b></div>`).join("");
 const m={};
 bs.forEach(b=>b.items.forEach(i=>{const k=i.lotId||i.lot,l=m[k]||(m[k]={name:i.lot,bags:0,kg:0,sales:0,profit:0,bills:new Set()});l.bags+=i.bags;l.kg+=i.kg;l.sales+=i.amount;l.profit+=i.amount-i.kg*(costs[i.lotId]||0);l.bills.add(b.id)}));
 const ls=Object.values(m).sort((a,b)=>b.profit-a.profit);
 $("#pl").innerHTML=ls.length?`<table><tr><th>Lot / quality</th><th>Bills</th><th>Bags sold</th><th>Kg sold</th><th>Sales</th><th>Cost</th><th>Profit</th><th>Per kg</th></tr>${ls.map(l=>`<tr><td>${esc(l.name)}</td><td>${l.bills.size}</td><td>${l.bags}</td><td>${r2(l.kg)}</td><td>${f(l.sales)}</td><td>${f(l.sales-l.profit)}</td><td class="${l.profit<0?"neg":""}">${f(l.profit)}</td><td>${f(l.kg?l.profit/l.kg:0)}</td></tr>`).join("")}<tr><th>Total</th><th>${bs.length}</th><th>${sum(ls,l=>l.bags)}</th><th>${r2(kg)}</th><th>${f(sales)}</th><th>${f(sales-tp)}</th><th>${f(tp)}</th><th></th></tr></table>`:`<div class="empty">No bills in this period yet.</div>`;
 $("#pb").innerHTML=bs.length?`<table><tr><th>Bill no.</th><th>Date</th><th>Customer</th><th>Lot</th><th>Kg</th><th>Sales</th><th>Profit</th></tr>${[...bs].reverse().map(b=>`<tr><td>${p2(b.no)}</td><td class="l">${b.date}</td><td class="l">${esc(b.cust)}</td><td class="l">${esc(b.lot)}</td><td>${b.kg}</td><td>${f(b.amount)}</td><td class="${b.profit<0?"neg":""}">${f(b.profit)}</td></tr>`).join("")}</table>`:`<div class="empty">No bills in this period yet.</div>`;
}

 $("#lt").innerHTML=lt;$("#st").innerHTML=lt.replace(/<th><\/th>/,"").replace(/<td><button[\s\S]*?<\/td>/g,"");

 .map(x=>`<div><span>${x[0]}</span><b>${x[1]}</b></div>`).join("");
 $("#dt").innerHTML=bs.length?`<table><tr><th>#</th><th>Customer</th><th>Lot</th><th>Bags</th><th>Kg</th><th>Total</th><th>Paid</th><th>Balance</th>${isOwner?"<th>Profit</th>":""}<th></th></tr>${bs.map(b=>{const p=paid(b),bal=b.total-p;return`<tr><td>${p2(b.no)}</td><td class="l">${esc(b.cust)}</td><td class="l">${esc(b.lot)}</td><td>${b.bags}</td><td>${b.kg}</td><td>${f(b.total)}</td><td>${f(p)}</td><td class="${bal>0.5?"neg":""}">${f(bal)}</td>${isOwner?`<td>${f(b.profit)}</td>`:""}<td><button class="sm" onclick="printBill('${b.id}')">Print</button>${bal>0.5?`<button class="sm" onclick="receive('${b.id}')">Receive</button>`:""}<button class="sm del" onclick="delBill('${b.id}')">Delete</button></td></tr>`}).join("")}</table>`:`<div class="empty">No bills on this date.</div>`;
 if(!$("#ld").value)$("#ld").value=today();
 if(!$("#xd").value)$("#xd").value=today();
 drawCart();renderStock();renderLedger();renderExp();renderBal();renderProfit();prevHint();
}
